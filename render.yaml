# Render Blueprint for Nexus Probe.
#
# Deploys two services:
#   nexus-backend   - FastAPI API the probes report to and the dashboard reads from
#   nexus-dashboard - the static React dashboard, built against nexus-backend's URL
#
# To use: in the Render dashboard, "New +" -> "Blueprint", point it at this repo.
# Render reads this file and creates both services. You'll be prompted for the
# envVars marked `sync: false` below - see docs/render-deploy.md for what to put there.
#
# Free-tier notes (accepted trade-offs for this project):
#   - NEXUS_DB_PATH points at the service's local disk, which is wiped on every
#     redeploy/restart on the free plan. The probe/alert/finding history resets
#     then - acceptable for a demo/test deployment, not for long-term storage.
#   - Free web services spin down after 15 min idle and take ~30-60s to wake on
#     the next request (cold start). The first probe heartbeat or dashboard load
#     after idle time will be slow; this is normal, not a bug.

services:
  - type: web
    name: nexus-backend
    runtime: python
    plan: free
    rootDir: nexus-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn nexus_backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEXUS_DB_PATH
        value: /tmp/nexus.db
      - key: NEXUS_CORS_ORIGINS
        value: https://nexus-dashboard.onrender.com
      - key: NEXUS_PROBE_KEYS
        sync: false
      - key: NEXUS_READ_TOKEN
        sync: false

  - type: web
    name: nexus-dashboard
    runtime: static
    rootDir: nexus-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_NEXUS_API_BASE
        value: https://nexus-backend.onrender.com
      - key: VITE_NEXUS_READ_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
